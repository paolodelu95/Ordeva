# Build dei pacchetti desktop dell'edizione offline **Tauri + Rust** su Windows,
# macOS (Intel + Apple Silicon) e Linux. Si attiva a ogni tag "v*" o manualmente.
# Ogni runner builda il proprio formato nativo: NSIS (.exe) + MSI, .dmg, .deb +
# .AppImage. SQLite è compilato nel binario (rusqlite "bundled"): nessun modulo
# nativo da ricompilare, a differenza dell'edizione Electron.
name: tauri-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Presidio veloce (§7 di docs/UI-UX-QUALITY-WORKFLOW.md): un solo job, prima di
  # tutto il resto, così un popup nativo rientrato blocca la release invece di
  # scoprirlo dopo aver compilato Rust su 4 piattaforme.
  ui-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Presidio UI/UX (popup nativi)
        run: ./scripts/ui-guard.sh

  # La release in bozza viene creata UNA volta sola, prima della matrice. Senza
  # questo, i job partivano in parallelo e provavano a crearla tutti insieme: i
  # due job macOS (stesso runner, avvio simultaneo) andavano in race e a turno
  # uno falliva con "already_exists" nello step di release. Creandola qui e
  # passando releaseId ai job, questi si limitano a CARICARE i bundle: niente race.
  create-release:
    needs: ui-guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Crea (o riusa) la release in bozza
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const { owner, repo } = context.repo;
            // Cerca una release esistente per questo tag (anche bozza, es. su re-run).
            const all = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const existing = all.data.find(r => r.tag_name === tag);
            if (existing) return existing.id;
            const created = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `Ordeva ${version}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            return created.data.id;

  build:
    needs: [ui-guard, create-release]
    # Gira sia su tag (dopo create-release) sia su run manuale (create-release
    # saltato per via dell'if): in quel caso non c'è release e si caricano artifact.
    # Ma mai se ui-guard fallisce, anche se create-release risulta "skipped"
    # anziché "failure" (per questo il controllo su ui-guard è separato).
    if: ${{ always() && needs.ui-guard.result == 'success' && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: ''
          - os: windows-latest
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Dipendenze di sistema per la WebView Tauri (solo Linux: WebKitGTK).
      - name: Linux deps (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential file

      - name: Frontend deps + build (config offline → frontend/dist/frontend/browser)
        working-directory: frontend
        run: |
          npm ci || npm install
          npx ng build --configuration offline

      # tauri-action compila il backend Rust + finestra, impacchetta e — su tag —
      # CARICA i bundle nella release in bozza creata da create-release (releaseId).
      # Su run manuale releaseId è vuoto: builda soltanto, senza pubblicare.
      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma updater: la chiave PRIVATA vive solo qui come secret del repo
          # (Settings → Secrets → Actions). La pubblica è in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Credenziali OAuth dell'app Ordeva (non dell'utente finale) per le
          # integrazioni marketplace/Google — lette a tempo di compilazione via
          # option_env!() in routes/marketplace.rs e routes/google_sync.rs.
          # Se un secret non è ancora configurato, la variabile resta vuota e
          # quella integrazione risponde "non configurata" invece di rompere la build.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
          # Credenziali LWA dell'app Amazon SP-API (Ordeva, non del venditore).
          # Finché i secret non sono configurati, la variabile resta vuota e la
          # UI mostra "Amazon in attesa" invece di rompere la build.
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
          # "1" finché l'app SP-API è in bozza (endpoint Sandbox, version=beta nel
          # consenso). Vuoto/rimosso quando l'app viene pubblicata.
          AMAZON_SANDBOX: ${{ secrets.AMAZON_SANDBOX }}
          # "1" finché le credenziali sopra sono quelle Sandbox (test): punta
          # agli host api.sandbox.ebay.com/auth.sandbox.ebay.com. Passare a
          # vuoto (o rimuovere il secret) quando si passa alle chiavi di Produzione.
          EBAY_SANDBOX: ${{ secrets.EBAY_SANDBOX }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # Run manuale (workflow_dispatch, senza tag): i bundle restano come artifact
      # scaricabili dalla pagina del run.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ordeva-tauri-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # Pubblica la release SOLO dopo che tutte le piattaforme hanno finito (needs: build).
  # Durante il build resta in bozza, così non diventa mai pubblica a metà (latest.json
  # incompleto). Quando ci sono tutti i bundle + le firme, la rende pubblica da sola:
  # niente più approvazione manuale.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pubblica la release (toglie lo stato bozza)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
