ShortDescription: Offline desktop ERP for Italian small businesses, with electronic invoicing.
Description: |-
  Ordeva is a desktop ERP that runs entirely on your own computer: no account, no
  subscription, no server. It covers customers and suppliers, products and stock,
  quotes, orders, delivery notes and invoices, purchases, payments, accounting and
  an agenda.

  It generates and validates Italian FatturaPA electronic invoices (TD01/TD04) and
  sends them through the intermediary you configure. Supplier invoices can be
  imported from their XML, or read from a PDF or a photo: text extraction and OCR
  run locally, so the document never leaves the computer.

  Data lives in a SQLite file in your user folder, with encrypted automatic backups
  (AES-256-GCM). Multiple company archives are supported, each protectable with a
  password. Available in Italian, English, German, Spanish and French.
